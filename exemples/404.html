<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fora do mapa · MOTION lab</title>
  <!-- autocontida: o 404 é servido em qualquer URL, então nada de caminho relativo -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100dvh; background: #100904; color: #ffedd7; }
    body { display: grid; align-content: center; gap: 24px; padding: 0 clamp(16px, 6vw, 96px); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
    p { margin: 0; font: 500 11px/1 ui-monospace, monospace; letter-spacing: .16em; text-transform: uppercase; color: #dc5000; }
    h1 { margin: 0; font-size: clamp(3rem, 12vw, 9rem); line-height: .92; letter-spacing: -.04em; }
    a { justify-self: start; display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; background: #dc5000; color: #100904; font-weight: 600; text-decoration: none; }
    a:hover, a:focus-visible { background: #ff6a1a; }
  </style>
</head>
<body>
  <p>404</p>
  <h1>Fora do mapa.</h1>
  <a id="home" href="/">Voltar ao dicionário</a>
  <script>
    /* num subcaminho do GitHub Pages (usuario.github.io/repo/), o início é o primeiro segmento */
    if (/\.github\.io$/.test(location.hostname)) {
      var seg = location.pathname.split('/')[1];
      if (seg) document.getElementById('home').href = '/' + seg + '/';
    }
  </script>
</body>
</html>
